# Netlify deploy config for Sprout (static PWA).
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: serve index.html for client-side routes.
# (Netlify serves real files like /printables/* and /sw.js first, so the PWA still works.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Make sure the service worker is always revalidated (PWA best practice).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
